<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dasomaries-lion5 | 교실</title>
  <meta name="description" content="dasomaries-lion5의 교실, 홈페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4ead7;
      --paper: #fbf5e8;
      --ink: #3d3126;
      --ink-dim: #7a6a57;
      --accent: #f2b33d;
      --accent-dark: #c98a12;
      --coral: #e07a5f;
      --coral-dark: #b85a40;
      --sky: #6fb7d9;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Gaegu", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .page {
      position: relative; z-index: 5;
      min-height: 100vh; width: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 20px;
      background: var(--bg);
    }
    .board {
      position: relative;
      width: 100%;
      max-width: 720px;
      padding: 44px 48px 36px 72px;
      border-radius: 16px;
      background-color: var(--paper);
      background-image: repeating-linear-gradient(180deg, transparent 0 35px, rgb(122 106 87 / 0.14) 35px 36px);
      background-position: 0 44px;
      box-shadow: 0 24px 50px -24px rgb(61 49 38 / 0.45), 0 2px 0 rgb(61 49 38 / 0.04);
      text-align: center;
    }
    .board::before {
      content: "";
      position: absolute; top: 0; bottom: 0; left: 52px; width: 2px;
      background: rgb(224 122 95 / 0.55);
      border-radius: 2px;
    }
    .board::after {
      content: "";
      position: absolute; left: 0; right: 0; top: 0; height: 10px;
      border-radius: 16px 16px 0 0;
      background: var(--accent);
      opacity: 0.85;
    }
    .date { font-size: 18px; color: var(--ink-dim); letter-spacing: 0.02em; }
    .date b { color: var(--accent-dark); font-weight: 700; }
    .bell { display: block; width: 64px; height: 64px; margin: 10px auto 6px; }
    h1 {
      margin: 14px 0 6px;
      font-size: clamp(38px, 6vw, 58px);
      font-weight: 700;
      line-height: 1.15;
    }
    .underline { display: block; width: 62%; height: 14px; margin: 0 auto 20px; }
    .underline path {
      fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
      stroke-dasharray: 300; stroke-dashoffset: 300;
    }
    .tagline { font-size: 22px; color: var(--ink-dim); }
    .timetable { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 36px 0 30px; }
    .subject {
      position: relative;
      display: block;
      padding: 22px 20px 18px;
      background: #fffdf7;
      border: 2px solid rgb(61 49 38 / 0.12);
      border-radius: 14px;
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 6px 0 -2px rgb(61 49 38 / 0.08);
      transition: transform .45s var(--ease), border-color .45s var(--ease), box-shadow .45s var(--ease);
    }
    .subject:hover, .subject:focus-visible {
      transform: translateY(-4px) rotate(-1deg);
      border-color: var(--accent);
      box-shadow: 0 14px 24px -14px rgb(61 49 38 / 0.45);
    }
    .period {
      display: inline-block; padding: 2px 12px; border-radius: 999px;
      font-size: 15px; font-weight: 700; color: var(--ink); background: var(--accent);
    }
    .subject.second .period { background: var(--sky); }
    .subject strong { display: block; margin-top: 12px; font-size: 24px; }
    .subject span.desc { display: block; margin-top: 4px; font-size: 16px; color: var(--ink-dim); }
    .notice {
      margin: 0 auto;
      max-width: 460px;
      padding: 14px 18px;
      font-size: 17px;
      color: var(--ink);
      background: #fffdf7;
      border-radius: 10px;
      border: 1px solid rgb(61 49 38 / 0.1);
      border-left: 5px solid var(--coral);
      text-align: left;
    }
    .notice b { color: var(--coral-dark); }
    footer { margin-top: 28px; font-size: 15px; color: var(--ink-dim); }

    /* ── 인트로 1 ── */
    .intro {
      position: fixed; inset: 0; z-index: 12;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: radial-gradient(ellipse at 50% 40%, #fff8e0 0%, rgb(255 248 224 / 0) 60%), var(--bg);
      overflow: hidden; color: var(--ink);
    }
    .dust {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: rgb(140 100 60 / 0.35); filter: blur(0.5px);
      animation: float 6s ease-in-out infinite;
    }
    .stage1 { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
    .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgb(242 179 61 / 0.7); opacity: 0; }
    .intro-bell { width: 92px; height: 92px; transform-origin: 50% 0; position: relative; }
    .intro-bell path {
      stroke: var(--accent-dark); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1 1;
    }
    .intro-bell circle { fill: var(--accent-dark); opacity: 0; }
    .intro-title {
      position: relative;
      font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: 0.04em;
      display: flex; gap: 0.12em; justify-content: center; margin-top: 18px;
    }
    .intro-title .ch { display: inline-block; }
    .intro-sub { font-size: 20px; color: var(--ink-dim); opacity: 0; }
    .flash {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50% 40%, rgb(255 252 240 / 0.9), rgb(255 252 240 / 0.25) 45%, transparent 70%);
    }

    /* ── 인트로 2 ── */
    .intro2 { position: fixed; inset: 0; z-index: 4; background: var(--paper); }
    .tiles { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
    .tile { position: absolute; background: var(--paper); }
    .tile.flying { box-shadow: 0 8px 16px -6px rgb(61 49 38 / 0.35); border-radius: 4px; }
    .spread {
      position: fixed; inset: 0; z-index: 7; background: #ffd23f;
      clip-path: circle(0px at var(--sx, 50%) var(--sy, 50%));
      visibility: hidden;
    }
    .teacher {
      position: fixed; left: 50%; top: 50%; z-index: 8;
      width: min(340px, 78vw); height: auto;
      transform: translate(-50%, -50%);
      overflow: visible; pointer-events: none;
    }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .c { fill-opacity: 0; }
    .halo { fill-opacity: 0; }
    .pen { opacity: 0; }
    .armR { transform-box: view-box; transform-origin: 252px 224px; }
    .glow { transform-box: fill-box; transform-origin: center; transform: scale(0); }
    .orbit { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .teacher.magic .orbit { opacity: 1; animation: spin 1.4s linear infinite; }
    .teacher.magic .glow { animation: glowPop .6s cubic-bezier(.2, 1.6, .4, 1) forwards; }

    .skip-btn {
      position: fixed; right: 20px; bottom: 20px; z-index: 13;
      padding: 8px 16px; border-radius: 999px; font: inherit; font-size: 15px; color: var(--ink);
      background: rgb(255 255 255 / 0.6); border: 1px dashed rgb(61 49 38 / 0.35); cursor: pointer;
    }
    .skip-btn:hover { border-color: var(--accent-dark); color: var(--accent-dark); }

    @media (prefers-reduced-motion: no-preference) {
      .intro { animation: introIn .4s ease both, curtain .8s var(--ease) 4.5s both; }
      .intro-bell path { animation: draw .9s ease .3s both; }
      .intro-bell { animation: wobble 1.4s ease 1.3s both; }
      .intro-bell circle { animation: fadeIn .4s ease 1.2s forwards; }
      .ring { animation: ringWave 1.2s ease-out both; }
      .ring:nth-child(2) { animation-delay: 1.45s; }
      .ring:nth-child(3) { animation-delay: 1.6s; }
      .intro-title .ch { animation: chalkIn .5s var(--ease) both; animation-delay: calc(2.5s + var(--i) * 0.09s); }
      .intro-sub { animation: rise .7s var(--ease) 3.6s forwards; }
      .flash { animation: flash .9s ease 4s both; }
      .halo { animation: haloIn .9s ease 5.6s forwards; }
      .teacher.move { animation: shrinkLeft 1.3s cubic-bezier(.6, 0, .2, 1) forwards; }
      .spread.go { visibility: visible; animation: spreadIn 1.1s cubic-bezier(.5, 0, .2, 1) forwards; }
      .spread.fade { visibility: visible; animation: fadeOut .9s ease forwards; }
      .armR.wave { animation: armWave 1.2s ease-in-out both; }
      .skip-btn { animation: rise .6s var(--ease) .2s both, hideBtn .1s linear 16s forwards; }

      .board { animation: boardIn .9s var(--ease) 0.3s both; }
      .date { animation: rise .8s var(--ease) .5s both; }
      h1 { animation: write 1.1s steps(18, end) .6s both; }
      .underline path { animation: drawLine .9s var(--ease) 1.4s forwards; }
      .tagline { animation: rise .8s var(--ease) 1.5s both; }
      .subject:nth-child(1) { animation: pin .8s var(--ease) 1.7s both; }
      .subject:nth-child(2) { animation: pin .8s var(--ease) 1.9s both; }
      .notice { animation: rise .8s var(--ease) 2.1s both; }
      footer { animation: rise .8s var(--ease) 2.3s both; }

      @keyframes introIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes curtain {
        0% { transform: none; visibility: visible; }
        99% { transform: translateY(-100%); visibility: visible; }
        100% { transform: translateY(-100%); visibility: hidden; }
      }
      @keyframes float { 0%, 100% { transform: translate(0, 0); opacity: 0.2; } 50% { transform: translate(18px, -26px); opacity: 0.8; } }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes wobble {
        0% { transform: rotate(0); } 15% { transform: rotate(-20deg); } 30% { transform: rotate(15deg); }
        45% { transform: rotate(-10deg); } 60% { transform: rotate(6deg); } 75% { transform: rotate(-3deg); } 100% { transform: rotate(0); }
      }
      @keyframes ringWave { 0% { transform: scale(0.7); opacity: 0.9; } 100% { transform: scale(2.8); opacity: 0; } }
      @keyframes chalkIn {
        from { opacity: 0; filter: blur(8px); transform: translateY(8px) scale(1.15); }
        to { opacity: 1; filter: blur(0); transform: none; }
      }
      @keyframes flash { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes boardIn { from { opacity: 0; transform: translateY(40px) scale(0.97); } to { opacity: 1; transform: none; } }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      @keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes drawLine { to { stroke-dashoffset: 0; } }
      @keyframes pin { from { opacity: 0; transform: translateX(-30px) rotate(-4deg); } to { opacity: 1; transform: none; } }
    }
    @keyframes fillIn { to { fill-opacity: 1; } }
    @keyframes haloIn { to { fill-opacity: 0.28; } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes hideBtn { to { opacity: 0; visibility: hidden; } }
    @keyframes glowPop { 0% { transform: scale(0); } 70% { transform: scale(1.35); } 100% { transform: scale(1); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes shrinkLeft {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(var(--ds, 0.5)); }
    }
    @keyframes armWave {
      0% { transform: rotate(0deg); } 30% { transform: rotate(-12deg); } 60% { transform: rotate(7deg); } 100% { transform: rotate(0deg); }
    }
    @keyframes spreadIn {
      from { clip-path: circle(0px at var(--sx, 50%) var(--sy, 50%)); }
      to { clip-path: circle(150vmax at var(--sx, 50%) var(--sy, 50%)); }
    }
    @keyframes fadeOut {
      from { opacity: 1; clip-path: circle(150vmax at var(--sx, 50%) var(--sy, 50%)); }
      to { opacity: 0; visibility: hidden; clip-path: circle(150vmax at var(--sx, 50%) var(--sy, 50%)); }
    }

    .skip .intro, .skip .intro2, .skip .tiles, .skip .spread, .skip .teacher, .skip .skip-btn { display: none !important; }
    .skip *, .skip *::before, .skip *::after { animation: none !important; }
    .skip .underline path { stroke-dashoffset: 0; }

    @media (prefers-reduced-motion: reduce) {
      .intro, .intro2, .tiles, .spread, .teacher, .skip-btn { display: none; }
      .underline path { stroke-dashoffset: 0; }
    }

    @media (max-width: 560px) {
      .board { padding: 34px 20px 28px 44px; }
      .board::before { left: 30px; }
      .timetable { grid-template-columns: 1fr; }
      .tagline { font-size: 19px; }
    }
  </style>
</head>

  <div class="page" id="page">
  <main class="board">
    <div class="date" id="today"></div>
    <svg class="bell" viewBox="0 0 64 64" fill="none" stroke="#c98a12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <h1>dasomaries-lion5의 교실</h1>
    <svg class="underline" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
      <path d="M4 9 C 70 2, 150 14, 296 5"/>
    </svg>
    <p class="tagline">오늘도 환영해요, 자리에 앉아 주세요</p>
    <nav class="timetable" aria-label="홈페이지 바로가기">

    <div class="notice"><b>알림장</b> 홈페이지는 GitHub Pages로 운영 중이에요. 궁금한 점은 GitHub에서 찾아 주세요.</div>

  <script>
    // 인트로 1: 글자 쪼개기
    var introTitle = document.getElementById("introTitle");
    var introText = introTitle.textContent;
    introTitle.textContent = "";
    Array.prototype.forEach.call(introText, function (ch, i) {
      var s = document.createElement("span");
      s.className = "ch";
      s.style.setProperty("--i", i);
      s.textContent = ch === " " ? "\u00A0" : ch;
      introTitle.appendChild(s);
    });

    // 인트로 1: 먼지
    var intro = document.getElementById("intro");
    for (var i = 0; i < 26; i++) {
      var d = document.createElement("span");
      d.className = "dust";
      d.style.left = Math.random() * 100 + "%";
      d.style.top = Math.random() * 100 + "%";
      d.style.animationDelay = (-Math.random() * 6) + "s";
      d.style.width = d.style.height = (2 + Math.random() * 4) + "px";
      intro.prepend(d);
    }

    document.getElementById("skipBtn").addEventListener("click", function () {
      document.body.classList.add("skip");
    });

    // 인트로 2: 공책 조각(타일) 만들기
    var tilesEl = document.getElementById("tiles");
    var COLS = 14, ROWS = 9, tiles = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var t = document.createElement("div");
        t.className = "tile";
        t.style.left = (c * 100 / COLS) + "%";
        t.style.top = (r * 100 / ROWS) + "%";
        t.style.width = (100 / COLS + 0.4) + "%";
        t.style.height = (100 / ROWS + 0.4) + "%";
        tilesEl.appendChild(t);
        tiles.push(t);
      }
    }

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var teacher = document.getElementById("teacher");
    var pen = document.getElementById("pen");
    var armR = document.getElementById("armR");
    var tipMark = document.getElementById("tipMark");
    var spread = document.getElementById("spread");
    var intro2El = document.getElementById("intro2");
    var root = document.documentElement;

    // 선 준비: 펜이 따라 그릴 수 있도록 길이 계산
    var lines = Array.prototype.map.call(teacher.querySelectorAll(".ln"), function (el) {
      el.removeAttribute("pathLength");
      var L = el.getTotalLength();
      var order = parseFloat(el.style.getPropertyValue("--d")) || 0;
      el.style.strokeDasharray = L + " " + L;
      el.style.strokeDashoffset = L;
      return { el: el, L: L, order: order };
    }).sort(function (a, b) { return a.order - b.order; });

    var SPEED = 1500;
    var cursor = 0;
    var segs = lines.map(function (o) {
      var dur = Math.max(120, (o.L / SPEED) * 1000);
      var seg = { el: o.el, L: o.L, s: cursor, e: cursor + dur };
      cursor += dur + 25;
      return seg;
    });
    var drawTotal = cursor;

    function drawStep(t0) {
      return function step(now) {
        var t = now - t0;
        var active = null;
        for (var k = 0; k < segs.length; k++) {
          var s = segs[k];
          if (t < s.s) { s.el.style.strokeDashoffset = s.L; continue; }
          if (t >= s.e) { s.el.style.strokeDashoffset = 0; continue; }
          var p = (t - s.s) / (s.e - s.s);
          s.el.style.strokeDashoffset = s.L * (1 - p);
          active = { s: s, p: p };
        }
        if (active) {
          var len = active.s.L * active.p;
          var a = active.s.el.getPointAtLength(len);
          var b = active.s.el.getPointAtLength(Math.min(active.s.L, len + 2));
          var ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI - 90;
          pen.setAttribute("transform", "translate(" + a.x + " " + a.y + ") rotate(" + ang + ")");
          pen.style.opacity = 1;
        } else {
          pen.style.opacity = 0;
        }
        if (t < drawTotal) requestAnimationFrame(step);
        else onDrawDone();
      };
    }

    function colorize() {
      Array.prototype.forEach.call(teacher.querySelectorAll(".c"), function (el, i) {
        el.style.animation = "fillIn .6s ease " + (0.1 + i * 0.04).toFixed(2) + "s forwards";
      });
    }

    function computeMove() {
      var r = teacher.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var wide = window.innerWidth >= 1000;
      var tx = wide ? Math.max(130, (window.innerWidth - 720) / 4) : 62;
      var ty = wide ? window.innerHeight * 0.7 : window.innerHeight - 120;
      var tw = wide ? 190 : 104;
      root.style.setProperty("--dx", (tx - cx) + "px");
      root.style.setProperty("--dy", (ty - cy) + "px");
      root.style.setProperty("--ds", (tw / r.width).toFixed(3));
    }

    function magicPhase() {
      teacher.classList.add("magic");
      var r = tipMark.getBoundingClientRect();
      var sx = r.left + r.width / 2, sy = r.top + r.height / 2;
      root.style.setProperty("--sx", sx + "px");
      root.style.setProperty("--sy", sy + "px");
      spread.classList.add("go");
      return { x: sx, y: sy };
    }

    function scatterTiles(origin) {
      var maxD = Math.hypot(window.innerWidth, window.innerHeight);
      tiles.forEach(function (tile) {
        var r = tile.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var dx = cx - origin.x, dy = cy - origin.y;
        var d = Math.hypot(dx, dy) || 1;
        var dist = 260 + Math.random() * 360;
        var tx = (dx / d) * dist + (Math.random() - 0.5) * 140;
        var ty = (dy / d) * dist + (Math.random() * 120 - 40);
        var rot = (Math.random() - 0.5) * 560;
        var delay = Math.min(0.55, (d / maxD) * 0.55) * 1000 + Math.random() * 160;
        tile.classList.add("flying");
        tile.animate([
          { transform: "translate(0px, 0px) rotate(0deg) scale(1)", opacity: 1 },
          { transform: "translate(" + tx + "px, " + ty + "px) rotate(" + rot + "deg) scale(0.4)", opacity: 0 }
        ], { duration: 1000, delay: delay, easing: "cubic-bezier(.2,.7,.2,1)", fill: "forwards" });
      });
    }

    function onDrawDone() {
      pen.style.opacity = 0;
      colorize();
      setTimeout(function () { armR.classList.add("wave"); }, 200);
      setTimeout(function () { computeMove(); teacher.classList.add("move"); }, 1500);
      setTimeout(function () {
        var origin = magicPhase();
        spread.classList.add("go");
        setTimeout(function () {
          spread.classList.remove("go");
          spread.classList.add("fade");
          scatterTiles(origin);
        }, 1000);
      }, 2900);
      setTimeout(function () {
        tilesEl.style.display = "none";
        spread.style.display = "none";
        intro2El.style.display = "none";
        teacher.classList.remove("magic");
      }, 5600);
    }

    if (!reduceMotion) {
      setTimeout(function () { requestAnimationFrame(drawStep(performance.now())); }, 5500);
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    var now = new Date();
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("today").innerHTML =
      now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 <b>" + days[now.getDay()] + "요일</b>";
  </script>
