<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dasomaries-lion5 | 교실</title>
  <meta name="description" content="dasomaries-lion5의 교실, 홈페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4ead7;
      --paper: #fbf5e8;
      --ink: #3d3126;
      --ink-dim: #7a6a57;
      --accent: #f2b33d;
      --accent-dark: #c98a12;
      --coral: #e07a5f;
      --coral-dark: #b85a40;
      --sky: #6fb7d9;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --fx: 50%;
      --fy: 50%;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Gaegu", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 공책 페이지 ── */
    .board {
      position: relative;
      width: 100%;
      max-width: 720px;
      padding: 44px 48px 36px 72px;
      border-radius: 16px;
      background-color: var(--paper);
      background-image: repeating-linear-gradient(
        180deg, transparent 0 35px, rgb(122 106 87 / 0.14) 35px 36px
      );
      background-position: 0 44px;
      box-shadow: 0 24px 50px -24px rgb(61 49 38 / 0.45), 0 2px 0 rgb(61 49 38 / 0.04);
      text-align: center;
    }
    .board::before {
      /* 공책 빨간 여백선 */
      content: "";
      position: absolute; top: 0; bottom: 0; left: 52px; width: 2px;
      background: rgb(224 122 95 / 0.55);
      border-radius: 2px;
    }
    .board::after {
      /* 상단 스프링 구멍 느낌 */
      content: "";
      position: absolute; left: 0; right: 0; top: 0; height: 10px;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, var(--accent) 0 100%);
      opacity: 0.85;
    }
    .date { font-size: 18px; color: var(--ink-dim); letter-spacing: 0.02em; }
    .date b { color: var(--accent-dark); font-weight: 700; }
    .bell {
      display: block;
      width: 64px; height: 64px;
      margin: 10px auto 6px;
    }
    h1 {
      margin: 14px 0 6px;
      font-size: clamp(38px, 6vw, 58px);
      font-weight: 700;
      line-height: 1.15;
    }
    .underline { display: block; width: 62%; height: 14px; margin: 0 auto 20px; }
    .underline path {
      fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
      stroke-dasharray: 300; stroke-dashoffset: 300;
    }
    .tagline { font-size: 22px; color: var(--ink-dim); }

    .timetable { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 36px 0 30px; }
    .subject {
      position: relative;
      display: block;
      padding: 22px 20px 18px;
      background: #fffdf7;
      border: 2px solid rgb(61 49 38 / 0.12);
      border-radius: 14px;
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 6px 0 -2px rgb(61 49 38 / 0.08);
      transition: transform .45s var(--ease), border-color .45s var(--ease), box-shadow .45s var(--ease);
    }
    .subject:hover, .subject:focus-visible {
      transform: translateY(-4px) rotate(-1deg);
      border-color: var(--accent);
      box-shadow: 0 14px 24px -14px rgb(61 49 38 / 0.45);
    }
    .period {
      display: inline-block; padding: 2px 12px; border-radius: 999px;
      font-size: 15px; font-weight: 700; color: var(--ink); background: var(--accent);
    }
    .subject.second .period { background: var(--sky); }
    .subject strong { display: block; margin-top: 12px; font-size: 24px; }
    .subject span.desc { display: block; margin-top: 4px; font-size: 16px; color: var(--ink-dim); }

    .notice {
      margin: 0 auto;
      max-width: 460px;
      padding: 14px 18px;
      font-size: 17px;
      color: var(--ink);
      background: #fffdf7;
      border-radius: 10px;
      border: 1px solid rgb(61 49 38 / 0.1);
      border-left: 5px solid var(--coral);
      text-align: left;
    }
    .notice b { color: var(--coral-dark); }
    footer { margin-top: 28px; font-size: 15px; color: var(--ink-dim); }

    /* ── 인트로 모션 그래픽 (약 5초) ── */
    .intro {
      position: fixed; inset: 0; z-index: 12;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background:
        radial-gradient(ellipse at 50% 40%, #fff8e0 0%, rgb(255 248 224 / 0) 60%),
        var(--bg);
      overflow: hidden;
      color: var(--ink);
    }
    .dust {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: rgb(140 100 60 / 0.35);
      filter: blur(0.5px);
      animation: float 6s ease-in-out infinite;
    }
    .stage { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgb(242 179 61 / 0.7);
      opacity: 0;
    }
    .intro-bell { width: 92px; height: 92px; transform-origin: 50% 0; position: relative; }
    .intro-bell path {
      stroke: var(--accent-dark); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1 1;
    }
    .intro-bell circle { fill: var(--accent-dark); opacity: 0; }
    .intro-title {
      position: relative;
      font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: 0.04em;
      display: flex; gap: 0.12em; justify-content: center; margin-top: 18px;
    }
    .intro-title .ch { display: inline-block; }
    .intro-sub { font-size: 20px; color: var(--ink-dim); opacity: 0; }
    .flash {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50% 40%, rgb(255 252 240 / 0.9), rgb(255 252 240 / 0.25) 45%, transparent 70%);
    }
    .skip-btn {
      position: fixed; right: 20px; bottom: 20px; z-index: 13;
      padding: 8px 16px; border-radius: 999px; font: inherit; font-size: 15px; color: var(--ink);
      background: rgb(255 255 255 / 0.6); border: 1px dashed rgb(61 49 38 / 0.35); cursor: pointer;
    }
    .skip-btn:hover { border-color: var(--accent-dark); color: var(--accent-dark); }

    /* ── 모션 ── */
    @media (prefers-reduced-motion: no-preference) {
      .intro { animation: introIn .4s ease both, curtain .8s var(--ease) 4.5s both; }
      .intro-bell path { animation: draw .9s ease .3s both; }
      .intro-bell { animation: wobble 1.4s ease 1.3s both; }
      .intro-bell circle { animation: fadeIn .4s ease 1.2s forwards; }
      .ring { animation: wave 1.2s ease-out both; }
      .ring:nth-child(2) { animation-delay: 1.45s; }
      .ring:nth-child(3) { animation-delay: 1.6s; }
      .intro-title .ch { animation: chalkIn .5s var(--ease) both; animation-delay: calc(2.5s + var(--i) * 0.09s); }
      .intro-sub { animation: rise .7s var(--ease) 3.6s forwards; }
      .flash { animation: flash .9s ease 4s both; }

      .board { animation: boardIn .9s var(--ease) 4.7s both; }
      .date { animation: rise .8s var(--ease) 5s both; }
      h1 { animation: write 1.1s steps(18, end) 5.1s both; }
      .underline path { animation: drawLine .9s var(--ease) 5.9s forwards; }
      .tagline { animation: rise .8s var(--ease) 6s both; }
      .subject:nth-child(1) { animation: pin .8s var(--ease) 6.2s both; }
      .subject:nth-child(2) { animation: pin .8s var(--ease) 6.4s both; }
      .notice { animation: rise .8s var(--ease) 6.6s both; }
      footer { animation: rise .8s var(--ease) 6.8s both; }
    }

    @keyframes introIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes curtain {
      0% { transform: none; visibility: visible; }
      99% { transform: translateY(-100%); visibility: visible; }
      100% { transform: translateY(-100%); visibility: hidden; }
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(18px, -26px); opacity: 0.8; }
    }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes hideBtn { to { opacity: 0; visibility: hidden; } }
    @keyframes wobble {
      0% { transform: rotate(0); }
      15% { transform: rotate(-20deg); }
      30% { transform: rotate(15deg); }
      45% { transform: rotate(-10deg); }
      60% { transform: rotate(6deg); }
      75% { transform: rotate(-3deg); }
      100% { transform: rotate(0); }
    }
    @keyframes wave {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @keyframes chalkIn {
      from { opacity: 0; filter: blur(8px); transform: translateY(8px) scale(1.15); }
      to { opacity: 1; filter: blur(0); transform: none; }
    }
    @keyframes flash {
      0% { opacity: 0; }
      35% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes boardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes write {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }
    @keyframes pin {
      from { opacity: 0; transform: translateX(-30px) rotate(-4deg); }
      to { opacity: 1; transform: none; }
    }

    /* 건너뛰기 */
    .skip .intro, .skip .intro2, .skip .skip-btn { display: none !important; }
    .skip *, .skip *::before, .skip *::after { animation: none !important; }
    .skip .underline path { stroke-dashoffset: 0; }
    .skip .page { clip-path: none; }

    @media (prefers-reduced-motion: reduce) {
      .intro, .intro2, .skip-btn { display: none; }
      .page { clip-path: none; }
      .underline path { stroke-dashoffset: 0; }
    }

    @media (max-width: 560px) {
      .board { padding: 34px 20px 28px 44px; }
      .board::before { left: 30px; }
      .timetable { grid-template-columns: 1fr; }
      .tagline { font-size: 19px; }
    }

    /* ── 두 번째 인트로: 선생님 드로잉 + 마법 ── */
    .intro2 {
      position: fixed; inset: 0; z-index: 8;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #fff8e0 0%, rgb(255 248 224 / 0) 60%), var(--bg);
      overflow: hidden;
    }
    .teacher { width: min(340px, 78vw); height: auto; overflow: visible; }
    .ln {
      fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1 1; stroke-dashoffset: 1;
    }
    .c { fill-opacity: 0; }
    .halo { fill-opacity: 0; }
    .glow { transform-box: fill-box; transform-origin: center; transform: scale(0); }
    .armR { transform-box: view-box; transform-origin: 262px 216px; }
    .page {
      position: relative; z-index: 9;
      min-height: 100vh; width: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 20px;
      background: var(--bg);
      clip-path: circle(0px at var(--fx, 50%) var(--fy, 50%));
    }
    @media (prefers-reduced-motion: no-preference) {
      .intro2 { animation: introIn .5s ease .0s both, hideIntro .01s linear 12s forwards; }
      .halo { animation: haloIn .9s ease 5.6s forwards; }
      .ln { animation: draw .8s ease var(--d) forwards; }
      .c { animation: fillIn .6s ease var(--d) forwards; }
      .armR { animation: flourish 1.1s ease-in-out 8.6s both; }
      .glow { animation: glowPop .6s cubic-bezier(.2, 1.6, .4, 1) 9.6s forwards; }
      .page { animation: reveal 1.6s cubic-bezier(.7, 0, .2, 1) 10.4s both; }
      .skip-btn { animation: rise .6s var(--ease) .2s both, hideBtn .1s linear 12s forwards; }
    }
    @keyframes haloIn { to { fill-opacity: 0.28; } }
    @keyframes fillIn { to { fill-opacity: 1; } }
    @keyframes hideIntro { to { opacity: 0; visibility: hidden; } }
    @keyframes flourish {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-14deg); }
      50% { transform: rotate(10deg); }
      75% { transform: rotate(-6deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes glowPop {
      0% { transform: scale(0); }
      70% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    @keyframes reveal {
      from { clip-path: circle(0px at var(--fx, 50%) var(--fy, 50%)); }
      to { clip-path: circle(150vmax at var(--fx, 50%) var(--fy, 50%)); }
    }
  </style>
</head>

  <script>
    // 인트로 글자 하나씩 쓰기
    const introTitle = document.getElementById("introTitle");
    const introText = introTitle.textContent;
    introTitle.textContent = "";
    [...introText].forEach((ch, i) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.style.setProperty("--i", i);
      s.textContent = ch === " " ? "\u00A0" : ch;
      introTitle.appendChild(s);
    });

    // 먼지 입자
    const intro = document.getElementById("intro");
    for (let i = 0; i < 26; i++) {
      const d = document.createElement("span");
      d.className = "dust";
      d.style.left = Math.random() * 100 + "%";
      d.style.top = Math.random() * 100 + "%";
      d.style.animationDelay = (-Math.random() * 6) + "s";
      d.style.width = d.style.height = (2 + Math.random() * 4) + "px";
      intro.prepend(d);
    }

    // 건너뛰기
    document.getElementById("skipBtn").addEventListener("click", () => {
      document.body.classList.add("skip");
    });

    // 손끝 위치를 재서 페이지가 그 지점에서 펼쳐지게 함
    const tipEl = document.getElementById("tip");
    function placeTip() {
      const r = tipEl.getBoundingClientRect();
      const st = document.documentElement.style;
      st.setProperty("--fx", (r.left + r.width / 2) + "px");
      st.setProperty("--fy", (r.top + r.height / 2) + "px");
    }
    placeTip();
    window.addEventListener("resize", placeTip);

    document.getElementById("year").textContent = new Date().getFullYear();
    const d = new Date();
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("today").innerHTML =
      d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 <b>" + days[d.getDay()] + "요일</b>";
  </script>
</body>
</html>
