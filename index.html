<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dasomaries-lion5 | 교실</title>
  <meta name="description" content="dasomaries-lion5의 교실, 홈페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4ead7;
      --paper: #fbf5e8;
      --ink: #3d3126;
      --ink-dim: #7a6a57;
      --accent: #f2b33d;
      --accent-dark: #c98a12;
      --coral: #e07a5f;
      --coral-dark: #b85a40;
      --sky: #6fb7d9;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Gaegu", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .page {
      position: relative; z-index: 9;
      min-height: 100vh; width: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 20px;
      background: var(--bg);
      opacity: 0;
      transform-origin: left center;
    }
    .page.open { animation: door 1.3s var(--ease) both; }
    @keyframes door {
      from { opacity: 0; transform: perspective(1800px) rotateY(80deg); }
      to { opacity: 1; transform: none; }
    }

    /* ── 공책 페이지 ── */
    .board {
      position: relative;
      width: 100%;
      max-width: 720px;
      padding: 44px 48px 36px 72px;
      border-radius: 16px;
      background-color: var(--paper);
      background-image: repeating-linear-gradient(180deg, transparent 0 35px, rgb(122 106 87 / 0.14) 35px 36px);
      background-position: 0 44px;
      box-shadow: 0 24px 50px -24px rgb(61 49 38 / 0.45), 0 2px 0 rgb(61 49 38 / 0.04);
      text-align: center;
    }
    .board::before {
      content: "";
      position: absolute; top: 0; bottom: 0; left: 52px; width: 2px;
      background: rgb(224 122 95 / 0.55);
      border-radius: 2px;
    }
    .board::after {
      content: "";
      position: absolute; left: 0; right: 0; top: 0; height: 10px;
      border-radius: 16px 16px 0 0;
      background: var(--accent);
      opacity: 0.85;
    }
    .date { font-size: 18px; color: var(--ink-dim); letter-spacing: 0.02em; }
    .date b { color: var(--accent-dark); font-weight: 700; }
    .bell { display: block; width: 64px; height: 64px; margin: 10px auto 6px; }
    h1 {
      margin: 14px 0 6px;
      font-size: clamp(38px, 6vw, 58px);
      font-weight: 700;
      line-height: 1.15;
    }
    .underline { display: block; width: 62%; height: 14px; margin: 0 auto 20px; }
    .underline path {
      fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
      stroke-dasharray: 300; stroke-dashoffset: 300;
    }
    .tagline { font-size: 22px; color: var(--ink-dim); }
    .timetable { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 36px 0 30px; }
    .subject {
      position: relative;
      display: block;
      padding: 22px 20px 18px;
      background: #fffdf7;
      border: 2px solid rgb(61 49 38 / 0.12);
      border-radius: 14px;
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 6px 0 -2px rgb(61 49 38 / 0.08);
      transition: transform .45s var(--ease), border-color .45s var(--ease), box-shadow .45s var(--ease);
    }
    .subject:hover, .subject:focus-visible {
      transform: translateY(-4px) rotate(-1deg);
      border-color: var(--accent);
      box-shadow: 0 14px 24px -14px rgb(61 49 38 / 0.45);
    }
    .period {
      display: inline-block; padding: 2px 12px; border-radius: 999px;
      font-size: 15px; font-weight: 700; color: var(--ink); background: var(--accent);
    }
    .subject.second .period { background: var(--sky); }
    .subject strong { display: block; margin-top: 12px; font-size: 24px; }
    .subject span.desc { display: block; margin-top: 4px; font-size: 16px; color: var(--ink-dim); }
    .notice {
      margin: 0 auto;
      max-width: 460px;
      padding: 14px 18px;
      font-size: 17px;
      color: var(--ink);
      background: #fffdf7;
      border-radius: 10px;
      border: 1px solid rgb(61 49 38 / 0.1);
      border-left: 5px solid var(--coral);
      text-align: left;
    }
    .notice b { color: var(--coral-dark); }
    footer { margin-top: 28px; font-size: 15px; color: var(--ink-dim); }

    /* ── 인트로 1 ── */
    .intro {
      position: fixed; inset: 0; z-index: 12;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: radial-gradient(ellipse at 50% 40%, #fff8e0 0%, rgb(255 248 224 / 0) 60%), var(--bg);
      overflow: hidden; color: var(--ink);
    }
    .dust {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: rgb(140 100 60 / 0.35); filter: blur(0.5px);
      animation: float 6s ease-in-out infinite;
    }
    .stage1 { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgb(242 179 61 / 0.7); opacity: 0;
    }
    .intro-bell { width: 92px; height: 92px; transform-origin: 50% 0; position: relative; }
    .intro-bell path {
      stroke: var(--accent-dark); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1 1;
    }
    .intro-bell circle { fill: var(--accent-dark); opacity: 0; }
    .intro-title {
      position: relative;
      font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: 0.04em;
      display: flex; gap: 0.12em; justify-content: center; margin-top: 18px;
    }
    .intro-title .ch { display: inline-block; }
    .intro-sub { font-size: 20px; color: var(--ink-dim); opacity: 0; }
    .flash {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50% 40%, rgb(255 252 240 / 0.9), rgb(255 252 240 / 0.25) 45%, transparent 70%);
    }

    /* ── 인트로 2 배경 ── */
    .intro2 {
      position: fixed; inset: 0; z-index: 8;
      background: radial-gradient(ellipse at 50% 40%, #fff8e0 0%, rgb(255 248 224 / 0) 60%), var(--bg);
    }
    /* ── 선생님 그림 (펜으로 그리고, 색칠하고, 왼쪽으로 이동) ── */
    .teacher {
      position: fixed; left: 50%; top: 50%; z-index: 10;
      width: min(340px, 78vw); height: auto;
      transform: translate(-50%, -50%);
      overflow: visible; pointer-events: none;
    }
    .ln {
      fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
    }
    .c { fill-opacity: 0; }
    .halo { fill-opacity: 0; }
    .pen { opacity: 0; }
    .armR { transform-box: view-box; transform-origin: 262px 216px; }
    .glow { transform-box: fill-box; transform-origin: center; transform: scale(0); }
    .orbit { opacity: 0; transform-box: view-box; transform-origin: 343px 56px; }
    .teacher.magic .orbit { opacity: 1; animation: spin 1.4s linear infinite; }

    /* 건너뛰기 */
    .skip-btn {
      position: fixed; right: 20px; bottom: 20px; z-index: 13;
      padding: 8px 16px; border-radius: 999px; font: inherit; font-size: 15px; color: var(--ink);
      background: rgb(255 255 255 / 0.6); border: 1px dashed rgb(61 49 38 / 0.35); cursor: pointer;
    }
    .skip-btn:hover { border-color: var(--accent-dark); color: var(--accent-dark); }

    @media (prefers-reduced-motion: no-preference) {
      .intro { animation: introIn .4s ease both, curtain .8s var(--ease) 4.5s both; }
      .intro-bell path { animation: draw .9s ease .3s both; }
      .intro-bell { animation: wobble 1.4s ease 1.3s both; }
      .intro-bell circle { animation: fadeIn .4s ease 1.2s forwards; }
      .ring { animation: wave 1.2s ease-out both; }
      .ring:nth-child(2) { animation-delay: 1.45s; }
      .ring:nth-child(3) { animation-delay: 1.6s; }
      .intro-title .ch { animation: chalkIn .5s var(--ease) both; animation-delay: calc(2.5s + var(--i) * 0.09s); }
      .intro-sub { animation: rise .7s var(--ease) 3.6s forwards; }
      .flash { animation: flash .9s ease 4s both; }
      .halo { animation: haloIn .9s ease 5.6s forwards; }
      .glow { }
      .teacher.magic .glow { animation: glowPop .6s cubic-bezier(.2, 1.6, .4, 1) forwards; }
      .teacher.move { animation: shrinkLeft 1.3s cubic-bezier(.6, 0, .2, 1) forwards; }
      .skip-btn { animation: rise .6s var(--ease) .2s both, hideBtn .1s linear 13s forwards; }

      .board { animation: boardIn .9s var(--ease) 0.3s both; }
      .date { animation: rise .8s var(--ease) .5s both; }
      h1 { animation: write 1.1s steps(18, end) .6s both; }
      .underline path { animation: drawLine .9s var(--ease) 1.4s forwards; }
      .tagline { animation: rise .8s var(--ease) 1.5s both; }
      .subject:nth-child(1) { animation: pin .8s var(--ease) 1.7s both; }
      .subject:nth-child(2) { animation: pin .8s var(--ease) 1.9s both; }
      .notice { animation: rise .8s var(--ease) 2.1s both; }
      footer { animation: rise .8s var(--ease) 2.3s both; }

      @keyframes introIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes curtain {
        0% { transform: none; visibility: visible; }
        99% { transform: translateY(-100%); visibility: visible; }
        100% { transform: translateY(-100%); visibility: hidden; }
      }
      @keyframes float {
        0%, 100% { transform: translate(0, 0); opacity: 0.2; }
        50% { transform: translate(18px, -26px); opacity: 0.8; }
      }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes wobble {
        0% { transform: rotate(0); }
        15% { transform: rotate(-20deg); }
        30% { transform: rotate(15deg); }
        45% { transform: rotate(-10deg); }
        60% { transform: rotate(6deg); }
        75% { transform: rotate(-3deg); }
        100% { transform: rotate(0); }
      }
      @keyframes wave { 0% { transform: scale(0.7); opacity: 0.9; } 100% { transform: scale(2.8); opacity: 0; } }
      @keyframes chalkIn {
        from { opacity: 0; filter: blur(8px); transform: translateY(8px) scale(1.15); }
        to { opacity: 1; filter: blur(0); transform: none; }
      }
      @keyframes flash { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes boardIn { from { opacity: 0; transform: translateY(40px) scale(0.97); } to { opacity: 1; transform: none; } }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      @keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes drawLine { to { stroke-dashoffset: 0; } }
      @keyframes pin { from { opacity: 0; transform: translateX(-30px) rotate(-4deg); } to { opacity: 1; transform: none; } }
    }
    @keyframes fillIn { to { fill-opacity: 1; } }
    @keyframes haloIn { to { fill-opacity: 0.28; } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes hideBtn { to { opacity: 0; visibility: hidden; } }
    @keyframes glowPop {
      0% { transform: scale(0); }
      70% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes shrinkLeft {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(var(--ds, 0.5)); }
    }
    @keyframes flourish {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-14deg); }
      50% { transform: rotate(10deg); }
      75% { transform: rotate(-6deg); }
      100% { transform: rotate(0deg); }
    }

    /* 건너뛰기: 인트로를 모두 건너뛰고 페이지 바로 표시 */
    .skip .intro, .skip .intro2, .skip .teacher, .skip .skip-btn { display: none !important; }
    .skip *, .skip *::before, .skip *::after { animation: none !important; }
    .skip .page { opacity: 1 !important; transform: none !important; }
    .skip .underline path { stroke-dashoffset: 0; }

    @media (prefers-reduced-motion: reduce) {
      .intro, .intro2, .teacher, .skip-btn { display: none; }
      .page { opacity: 1; transform: none; }
      .underline path { stroke-dashoffset: 0; }
    }

    @media (max-width: 560px) {
      .board { padding: 34px 20px 28px 44px; }
      .board::before { left: 30px; }
      .timetable { grid-template-columns: 1fr; }
      .tagline { font-size: 19px; }
    }
  </style>
</head>

  <script>
    // 인트로 1: 글자 쪼개기
    const introTitle = document.getElementById("introTitle");
    const introText = introTitle.textContent;
    introTitle.textContent = "";
    [...introText].forEach((ch, i) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.style.setProperty("--i", i);
      s.textContent = ch === " " ? "\u00A0" : ch;
      introTitle.appendChild(s);
    });

    // 인트로 1: 먼지
    const intro = document.getElementById("intro");
    for (let i = 0; i < 26; i++) {
      const d = document.createElement("span");
      d.className = "dust";
      d.style.left = Math.random() * 100 + "%";
      d.style.top = Math.random() * 100 + "%";
      d.style.animationDelay = (-Math.random() * 6) + "s";
      d.style.width = d.style.height = (2 + Math.random() * 4) + "px";
      intro.prepend(d);
    }

    document.getElementById("skipBtn").addEventListener("click", () => {
      document.body.classList.add("skip");
    });

    // 인트로 2: 펜으로 선 그리기
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const teacher = document.getElementById("teacher");
    const pen = document.getElementById("pen");
    const armR = document.getElementById("armR");
    const pageEl = document.getElementById("page");
    const intro2El = document.getElementById("intro2");
    const root = document.documentElement;

    const lines = [...teacher.querySelectorAll(".ln")].map(el => {
      el.removeAttribute("pathLength");
      const L = el.getTotalLength();
      const order = parseFloat(el.style.getPropertyValue("--d")) || 0;
      el.style.strokeDasharray = L + " " + L;
      el.style.strokeDashoffset = L;
      return { el, L, order };
    }).sort((a, b) => a.order - b.order);

    const SPEED = 560; // 펜 이동 속도 (단위/초)
    let cursor = 0;
    const segs = lines.map(o => {
      const dur = Math.max(200, (o.L / SPEED) * 1000);
      const seg = { ...o, s: cursor, e: cursor + dur };
      cursor += dur + 50;
      return seg;
    });
    const drawTotal = cursor;

    function drawStep(t0) {
      return function step(now) {
        const t = now - t0;
        let active = null;
        for (const s of segs) {
          if (t < s.s) { s.el.style.strokeDashoffset = s.L; continue; }
          if (t >= s.e) { s.el.style.strokeDashoffset = 0; continue; }
          const p = (t - s.s) / (s.e - s.s);
          s.el.style.strokeDashoffset = s.L * (1 - p);
          active = { s, p };
        }
        if (active) {
          const { s, p } = active;
          const len = s.L * p;
          const a = s.el.getPointAtLength(len);
          const b = s.el.getPointAtLength(Math.min(s.L, len + 2));
          const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI - 90;
          pen.setAttribute("transform", "translate(" + a.x + " " + a.y + ") rotate(" + ang + ")");
          pen.style.opacity = 1;
        } else {
          pen.style.opacity = 0;
        }
        if (t < drawTotal) requestAnimationFrame(step);
        else onDrawDone();
      };
    }

    function colorize() {
      [...teacher.querySelectorAll(".c")].forEach((el, i) => {
        el.style.animation = "fillIn .6s ease " + (0.1 + i * 0.05).toFixed(2) + "s forwards";
      });
    }

    function computeMove() {
      const r = teacher.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const wide = window.innerWidth >= 1000;
      const tx = wide ? Math.max(120, (window.innerWidth - 720) / 4) : 70;
      const ty = wide ? cy : 70;
      const tw = wide ? 170 : 90;
      root.style.setProperty("--dx", (tx - cx) + "px");
      root.style.setProperty("--dy", (ty - cy) + "px");
      root.style.setProperty("--ds", (tw / r.width).toFixed(3));
    }

    function onDrawDone() {
      pen.style.opacity = 0;
      colorize();                                   // 색칠
      setTimeout(() => { armR.style.animation = "flourish 1.1s ease-in-out both"; }, 200); // 팔 흔들기
      setTimeout(() => teacher.classList.add("magic"), 1400);   // 손끝에서 마법 빛
      setTimeout(() => { computeMove(); teacher.classList.add("move"); }, 2800); // 왼쪽으로 작아지며 이동
      setTimeout(() => pageEl.classList.add("open"), 3500);     // 페이지가 열림
      setTimeout(() => { intro2El.style.display = "none"; }, 4800);
    }

    if (!reduceMotion) {
      setTimeout(() => {
        requestAnimationFrame(drawStep(performance.now()));
      }, 5500);
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    const d = new Date();
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("today").innerHTML =
      d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 <b>" + days[d.getDay()] + "요일</b>";
  </script>
</body>
</html>
